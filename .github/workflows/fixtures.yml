name: Fixtures

# Regenerate the existing honest/random one-Action and two-Action verifier
# fixture families and their proof-byte siblings from Zakura's released exporters.
# The four exact capture tests and release/package checksums are selected from
# Zcash/Snark/ZeroKnowledge/Zakura/release.json by the regeneration tooling.
# The separate prover captures use Common's pinned Rust-hosted exporter under
# prover-fingerprint / unstable-prover-fingerprint. Lean CI independently
# replays their complete selected executions; this is not universal Rust/Lean parity.
#
# This workflow always reports its required status. Local inventory/provenance
# guards run on every event; actual regeneration runs when its inputs change or
# on the schedule/manual triggers. The source and generated bytes are checked,
# so existing captures must be refreshed before they can match a changed target.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # weekly pin canary (Mondays 05:23 UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect fixture-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists changed files through the pull request API
    outputs:
      # Scheduled and manually dispatched runs bypass the filter (the filter step is
      # skipped, and this expression then forces regeneration).
      fixtures: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.filter.outputs.fixtures }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Repo-local, filter-independent guards: the committed capture-artifact set equals the
      # script's pinned regeneration list, every capture carries the exporter header, and any
      # header-carrying Lean file outside the pinned list fails whatever its basename. A new
      # or renamed fixture family fails here on the PR that adds it, instead of sitting in
      # the tree as a "capture" nothing regenerates.
      - name: Check the committed capture-artifact set against the pinned list
        run: ./scripts/regenerate-fingerprint-fixtures.sh --check-set
      # Digest-level provenance, also filter-independent: every committed capture must match
      # its manifest entry (path, sha256, generator, source, invocation), and any
      # generated-looking artifact without an entry fails. Binds the committed bytes to their
      # recorded provenance on every run, not only when a full regeneration executes.
      - name: Check the fixture provenance manifest
        run: ./scripts/check_fixture_manifest.sh
      # Regeneration is expensive (real k=11 Orchard proofs + verifier runs), so only run
      # it when a committed capture artifact or the pins change.
      #
      # Deliberately absent from the list: the captures' Lean-side import surface
      # (`Zcash/Snark.lean`, `Zcash/Snark/Core/Vesta.lean`, the lakefile globs), which the
      # cache and import restructuring moved. Regeneration cannot observe it — the
      # `import Zcash.Snark` header and the data under it both come from the pinned Rust
      # exporter, so a Lean-side move emits byte-identical output and the diff would be a
      # guaranteed pass bought with a full k=11 proving run. The risk it does carry is that
      # the emitted header stops resolving, and that is caught where the captures elaborate:
      # `FixtureCheck`, in `lean.yml`. Anything that changes what the exporter emits must
      # move the pinned script, which IS filtered.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            fixtures:
              - 'Zcash/Snark/Fixtures/SingleAction/Honest/Fixture.lean'
              - 'Zcash/Snark/Fixtures/MultiAction/Honest/Fixture.lean'
              - 'Zcash/Snark/Fixtures/SingleAction/Random/Fixture.lean'
              - 'Zcash/Snark/Fixtures/SingleAction/Random/proof-bytes.hex'
              - 'Zcash/Snark/Fixtures/MultiAction/Random/Fixture.lean'
              - 'Zcash/Snark/Fixtures/MultiAction/Random/proof-bytes.hex'
              - 'Zcash/Snark/Fixtures/MANIFEST.tsv'
              - 'Zcash/Snark/Fixtures/Prover/SingleAction.lean'
              - 'Zcash/Snark/Fixtures/Prover/MultiAction.lean'
              - 'Zcash/Snark/Fixtures/Prover/producer.json'
              - 'Zcash/Snark/ZeroKnowledge/Zakura/release.json'
              - 'scripts/regenerate-fingerprint-fixtures.sh'
              - 'scripts/regenerate-prover-fixtures.sh'
              - 'scripts/regenerate_fingerprint_fixtures.py'
              - 'scripts/prepare_zakura_release.py'
              - 'scripts/check_zakura_release.py'
              - '.github/workflows/fixtures.yml'

  verify:
    name: Regenerate and diff the captured fixtures
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Ironwood (the fixtures under test)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Authenticate the release sources and crates, use Common's toolchain/lockfile,
      # execute its four existing capture drivers, and compare all six artifacts.
      # CI never uses --update; any mismatch fails the check.
      - name: Regenerate existing fixtures from the pinned Zakura release
        env:
          REGEN_WORK_DIR: ${{ runner.temp }}/zakura-fixtures
        run: ./scripts/regenerate-fingerprint-fixtures.sh
      - name: Regenerate complete prover executions from the pinned Common exporter
        env:
          REGEN_WORK_DIR: ${{ runner.temp }}/zakura-prover-fixtures
        run: ./scripts/regenerate-prover-fixtures.sh

  fixtures-ci:
    # The single stable check to mark as a required status check. It always runs, so it
    # always reports; it fails only if regeneration actually diverged.
    name: Fixtures CI
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the verification result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The changes-detection job did not succeed."
            exit 1
          fi
          case "$VERIFY_RESULT" in
            success|skipped)
              echo "Fixtures matched the pinned capture, or regeneration was not required for this change." ;;
            *)
              echo "Fixture verification result: $VERIFY_RESULT."
              exit 1 ;;
          esac
